# Nginx Configuration Snippet for Ternis DNS Zone Provisioner
# Add inside your existing server block or as a dedicated virtual host:

# Static Frontend UI
location /dns-provisioner/ {
    alias /var/www/one.mx.ternis.net/dns-provisioner/;
    index index.html;
    try_files $uri $uri/ /dns-provisioner/index.html;
}

# Backend REST API Proxy
location /dns-api/ {
    proxy_pass http://127.0.0.1:8089/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
